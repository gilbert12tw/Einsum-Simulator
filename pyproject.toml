[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cudaq-einsum"
version = "0.1.0"
description = "Convert CUDA-Q quantum circuits to einsum tensor network representation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
torch = ["torch"]
opt_einsum = ["opt_einsum"]
all = ["torch", "opt_einsum"]

[project.scripts]
cudaq-einsum-install = "cudaq_einsum:install_cudaq_target"

